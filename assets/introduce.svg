<svg xmlns="http://www.w3.org/2000/svg" width="629" height="146" viewBox="0 0 629 146" style="color:#17191c;font-family:Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<path d="M0 2h629 M0 144h629" stroke="currentColor" stroke-width="2"/><text x="314.5" y="52" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500">6명으로 시작한 팀이 40명으로 성장하는 동안, 웹과 WebView 서비스를 만들고 운영했습니다.</text><text x="314.5" y="77" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500">U+tv모바일에서는 사용자가 홈을 열고 첫 콘텐츠를 보기까지의 시간을 줄였습니다.</text><text x="314.5" y="102" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500">운영 중 문제가 생기면 동료들과 발생 조건을 재현하고, 측정 결과를 보며 해결 방법을 정합니다.</text>
</svg>
